name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.1.7)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release-windows:
    name: 'Windows build'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download Windows bundled binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./scripts/setup-deps.js

      - name: Create binaries.zip
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/binaries/*.exe" -DestinationPath "binaries.zip" -Force

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version and signing setup
        run: node scripts/check-release-config.cjs

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'v__VERSION__'
          releaseBody: 'Download the Windows installer from the assets below.'
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          prerelease: false

      - name: Upload binaries.zip to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:RELEASE_TAG" binaries.zip --clobber

  publish:
    name: Publish complete update
    needs: release-windows
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Verify updater manifest
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/update"
          node scripts/check-update-manifest.cjs "$RUNNER_TEMP/update/latest.json"
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
